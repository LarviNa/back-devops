name: Deploy Backend to EC2

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1                   # Configura aquí tu región de AWS
  ECR_REPOSITORY: backend-repo            # Nombre de tu repositorio en ECR

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # AWS Academy requiere token de sesión
        aws-region: ${{ env.AWS_REGION }}

    - name: Iniciar sesión en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Construir, etiquetar y subir imagen a Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Desplegar en EC2 vía SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST_BACKEND }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          
          docker stop backend-app || true
          docker rm backend-app || true
          
          docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          
          # Levantar backend en puerto 3000. Asegurar persistencia de red si es necesario.
          # Se pasan las credenciales de BD mediante entorno o se configuran en la EC2.
          docker run -d \
            --name backend-app \
            --restart unless-stopped \
            -p 3000:3000 \
            --env-file /home/${{ secrets.EC2_USERNAME }}/.env \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
